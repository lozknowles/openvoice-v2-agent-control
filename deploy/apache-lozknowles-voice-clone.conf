# Insert inside the lozknowles.com TLS VirtualHost. Authentication credentials
# live only in /etc/apache2/auth/lozknowles-voice-clone.htpasswd.
# The containing VirtualHost's CustomLog uses env=!voice_clone_no_log so upload
# and generated-file paths are not retained in the ordinary access log.

RedirectMatch 302 "^/voice-clone$" "/voice-clone/"
SetEnvIf Request_URI "^/voice-clone/" voice_clone_no_log

ProxyPass        "/voice-clone/queue/join" "ws://100.125.120.114:17862/queue/join" retry=0 timeout=600
ProxyPassReverse "/voice-clone/queue/join" "ws://100.125.120.114:17862/queue/join"
ProxyPass        "/voice-clone/" "http://100.125.120.114:17862/" connectiontimeout=5 timeout=600 retry=0
ProxyPassReverse "/voice-clone/" "http://100.125.120.114:17862/"

<Location "/voice-clone/">
    AuthType Basic
    AuthName "Voice Clone password beta"
    AuthBasicProvider file
    AuthUserFile /etc/apache2/auth/lozknowles-voice-clone.htpasswd
    Require valid-user

    LimitRequestBody 16777216
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Prefix "/voice-clone"

    Header always set Cache-Control "no-store, private"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    Header always set X-Content-Type-Options "nosniff"
    Header always unset Server
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(self)"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' ws: wss:; form-action 'self'; frame-ancestors 'self'"
</Location>
