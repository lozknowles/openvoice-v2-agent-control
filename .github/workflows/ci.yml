name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check pytest
      - run: >-
          python -m pytest -q
          tests/test_speech_interface.py
          tests/test_elevenlabs_adapter.py
          tests/test_speech_benchmarks.py
          tests/test_public_history_audit.py
      - run: >-
          python scripts/verify_repo_hygiene.py
          --repo .
          --report "${RUNNER_TEMP}/repository-hygiene.json"
      - run: >-
          python scripts/audit_public_history.py
          --repo .
          --report "${RUNNER_TEMP}/public-history-audit.json"
